<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension List</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container">
        <header class="header">
            <h1 class="page-title">Extension List </h1>

            <div class="filter-buttons">
                <button class="filter-button active" data-filter="all">
                    All
                </button>
                <button class="filter-button" data-filter="active">
                    Active
                </button>
                <button class="filter-button" data-filter="inactive">
                    Inactive
                </button>
            </div>
        </header>

        <main id="extensions-container" class="extensions-grid">

        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
